name: Orders API CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff
        run: python -m ruff check .

      - name: MyPy
        run: python -m mypy src

      - name: PyTest
        run: python -m pytest

      - name: Build Python Package
        run: python -m build

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/orders-api:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/orders-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/orders-api:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/orders-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/orders-api:latest