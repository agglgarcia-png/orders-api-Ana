[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-api"
version = "1.0.0"
description = "Order Management API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]"
]

[tool.setuptools.packages.find]
where = ["src"]